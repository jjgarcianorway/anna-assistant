name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Check required files exist
  required-files:
    name: Required Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION exists and is valid
        run: |
          if [ ! -f VERSION ]; then
            echo "ERROR: VERSION file missing"
            exit 1
          fi
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version format: $VERSION"
            exit 1
          fi
          echo "VERSION: $VERSION"

      - name: Check required files
        run: |
          files=(
            "SPEC.md"
            "CHANGELOG.md"
            "RELEASE_CONTRACT.md"
            "scripts/install.sh"
            "scripts/uninstall.sh"
            "scripts/release.sh"
            "docs/UPDATE_PROTOCOL.md"
          )
          missing=0
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              missing=1
            else
              echo "OK: $file"
            fi
          done
          exit $missing

      - name: Check scripts are executable
        run: |
          for script in scripts/*.sh; do
            if [ ! -x "$script" ]; then
              echo "ERROR: $script is not executable"
              exit 1
            fi
            echo "OK: $script is executable"
          done

  # Check 400-line limit (advisory - doesn't block CI)
  line-limit:
    name: 400-Line Limit (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true  # v0.0.168: Don't block CI, modularization in progress
    steps:
      - uses: actions/checkout@v4

      - name: Check file line counts
        run: |
          echo "Checking source files for 400-line limit..."
          violations=0
          violation_count=0

          # Check Rust source files (exclude tests directory)
          for file in $(find crates -name "*.rs" -type f -not -path "*/tests/*"); do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 400 ]; then
              echo "WARN: $file has $lines lines (limit: 400)"
              violation_count=$((violation_count + 1))
            fi
          done

          # Check shell scripts
          for file in $(find scripts -name "*.sh" -type f); do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 400 ]; then
              echo "WARN: $file has $lines lines (limit: 400)"
              violation_count=$((violation_count + 1))
            fi
          done

          if [ $violation_count -gt 0 ]; then
            echo ""
            echo "Found $violation_count files exceeding 400-line limit."
            echo "This is advisory - modularization is ongoing."
          else
            echo "All files within 400-line limit!"
          fi
          # Always succeed - this is advisory
          exit 0

  # Check CLI surface is locked
  cli-surface:
    name: CLI Surface Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build annactl
        run: cargo build --release -p annactl

      - name: Verify CLI surface
        run: |
          ANNACTL="./target/release/annactl"

          # Test --version works
          $ANNACTL --version

          # Test -V works
          $ANNACTL -V

          # Test help shows only allowed commands
          help_output=$($ANNACTL --help)

          # v0.0.168: Allowed commands (reset removed in v0.0.144)
          allowed=("status" "uninstall" "stats")
          for cmd in "${allowed[@]}"; do
            if ! echo "$help_output" | grep -q "$cmd"; then
              echo "ERROR: Missing allowed command: $cmd"
              exit 1
            fi
            echo "OK: Found allowed command: $cmd"
          done

          echo "CLI surface check passed"

  # Check version consistency
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"

          # v0.0.168: install.sh uses fetch_version() to get version dynamically from GitHub
          # Check that it has the fetch_version function
          if ! grep -q 'fetch_version' scripts/install.sh; then
            echo "ERROR: scripts/install.sh missing fetch_version function"
            exit 1
          fi
          echo "OK: install.sh uses dynamic version fetching"

          # Check Cargo.toml workspace version matches VERSION file
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\([^"]*\)"/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "ERROR: Cargo.toml version $CARGO_VERSION doesn't match VERSION $VERSION"
            exit 1
          fi
          echo "OK: Cargo.toml version matches"

          echo "Version consistency check passed"

  # Build and test
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

  # Check release script creates correct artifact names
  release-artifact-naming:
    name: Release Artifact Naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release.sh artifact naming
        run: |
          # The release script must name binaries correctly for auto-update
          if ! grep -q 'annad-linux-x86_64' scripts/release.sh; then
            echo "ERROR: release.sh missing correct annad-linux-x86_64 naming"
            exit 1
          fi
          if ! grep -q 'annactl-linux-x86_64' scripts/release.sh; then
            echo "ERROR: release.sh missing correct annactl-linux-x86_64 naming"
            exit 1
          fi
          if ! grep -q 'SHA256SUMS' scripts/release.sh; then
            echo "ERROR: release.sh missing SHA256SUMS"
            exit 1
          fi
          echo "OK: Release script has correct artifact naming"

  # All checks must pass
  all-checks:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [required-files, line-limit, cli-surface, version-consistency, build, release-artifact-naming]
    steps:
      - name: All checks passed
        run: echo "All CI checks passed!"
